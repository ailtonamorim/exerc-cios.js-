<!-- Elaborar uma leia um valor de uma janta. Caulcule e informe o valor da taxa do garçom 10% e o valor a ser pago -->
 
<script>

    const valor = Number(prompt("Digite o volor da janta:"));
    const taxaGarcom = valor * 0.10;
    const total =  valor + taxaGarcom;
    alert(`Taxa garçom R$: ${taxaGarcom.toFixed(2)}\nTotal R$: ${total.toFixed(2)}`);
</script>
