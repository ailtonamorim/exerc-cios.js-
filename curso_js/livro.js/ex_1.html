<!-- Elaborar uma programa que leia 2 notas de um aluno em uma  disciplina. Calcule e informe a média das notas. -->

<script>
    const nota1 = Number(prompt("Nota 1º: "));
    const nota2 = Number(prompt("Nota 2º: "));
    const media = (nota1 + nota2) / 2;
    alert(`A média das notas: ${media.toFixed(2)}`);

</script>
